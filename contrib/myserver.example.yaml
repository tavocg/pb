# pb.yaml - Configuration for pb
#
# All options here are set to the default values. If no configuration file is
# found, then these values will be used.

# Enable development features like source locations in logs.
# Override with:
#   PB_DEV=true pb serve
#   pb serve --dev
dev: false

# Host or interface to bind to. Empty means the default bind behavior.
# Override with:
#   PB_HOST=127.0.0.1 pb serve
#   pb serve --host 127.0.0.1
host: ""

# TCP port to listen on.
# Override with:
#   PB_PORT=8080 pb serve
#   pb serve --port 8080
port: 3080

# Auth settings.
# Override with:
#   PB_AUTH_SECRET=change-me pb serve
#   pb serve --auth-secret change-me
#   PB_AUTH_ACCESS_TOKEN_TTL=15m pb serve
#   pb serve --auth-access-ttl 15m
#   PB_AUTH_REFRESH_TOKEN_TTL=720h pb serve
#   pb serve --auth-refresh-ttl 720h
auth:
  secret: ""
  access-token-ttl: 15m
  refresh-token-ttl: 720h

# Route prefix to mount the app under.
# Override with:
#   PB_ROOT=/app pb serve
#   pb serve --root /prefix
root: ""

# Log output format. Valid values: json, text.
# Override with:
#   PB_LOGFMT=text pb serve
#   pb serve --logfmt text
logfmt: json

# Minimum log level. Valid values: debug, info, warn, error.
# Override with:
#   PB_LOGLVL=debug pb serve
#   pb serve --loglvl debug
loglvl: info

# Database connection string or path.
# Override with:
#   PB_DB=data/custom.sqlite pb serve
#   pb serve --db data/custom.sqlite
db: data/pb.sqlite
